name: OpenTimestamps (nightly)
on:
  schedule:
    - cron: "17 1 * * *"     # every night at 01:17 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install opentimestamps-client requests
      - name: Stamp new fingerprints and upgrade earlier proofs
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          STAMP_KEY: ${{ secrets.STAMP_KEY }}
        run: python stamp.py
      - name: Save proofs
        run: |
          git config user.name "ocra-stamp-bot"
          git config user.email "ocra-stamp-bot@users.noreply.github.com"
          git add proofs
          git diff --cached --quiet || git commit -m "Proofs $(date -u +%Y-%m-%d)"
          git push
